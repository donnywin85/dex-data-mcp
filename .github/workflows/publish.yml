# .github/workflows/publish.yml — publish to npm from CI, so the token never
# needs to reach a laptop.
#
# WHY CI RATHER THAN A LOCAL `npm publish`: the npm token is the last thing
# blocking the official MCP Server Registry (which hosts metadata only, so an
# npm package is a hard prerequisite). Putting the token in a GitHub Actions
# secret means it can be added from a phone browser, never lands on disk, and
# never passes through a chat log. It also means releases keep working from any
# machine, or none.
#
# Trigger: push a tag like v1.0.0, or run it by hand from the Actions tab —
# both of which are doable from the GitHub mobile UI.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: false
      provenance:
        description: 'Attach npm provenance (needs a token that can publish without OTP)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # MUST come after setup-node: setup-node installs its own bundled npm and
      # would overwrite an earlier upgrade. Trusted Publishing needs npm >= 11.5.
      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: |
          npm install -g npm@latest
          npm --version

      # The server is dependency-free on purpose, so there is nothing to install.
      # Still prove it parses and speaks MCP before anything is published — a
      # broken package on npm is far more expensive to fix than a failed job.
      - name: Syntax check
        run: node --check server.mjs

      # The version lives in FOUR places that drift independently, and the MCP
      # registry validates only that package.json and server.json agree.
      # serverInfo was found two versions stale (1.1.0 against a 1.2.0 package)
      # and it is what a client reads at handshake — so every caller was being
      # told the wrong version. Catch it here, not after an immutable publish.
      - name: Versions agree across all four fields
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const src = fs.readFileSync("server.mjs", "utf8");
            const m = src.match(/serverInfo:\s*\{[^}]*version:\s*"([^"]+)"|serverInfo:\s*\{[^}]*version:\s*\x27([^\x27]+)\x27/);
            const info = m && (m[1] || m[2]);
            const seen = { "package.json": pkg, "server.json": srv.version, "server.json packages[0]": srv.packages[0].version, "serverInfo": info };
            console.log(seen);
            if (!info) { console.error("could not find serverInfo version in server.mjs"); process.exit(1); }
            const bad = Object.entries(seen).filter(([, v]) => v !== pkg);
            if (bad.length) { console.error("VERSION MISMATCH:", bad); process.exit(1); }
            console.log(`OK: all four report ${pkg}`);
          '

      - name: Smoke test the MCP protocol
        run: |
          node -e '
            const { spawn } = require("child_process");
            const p = spawn(process.execPath, ["server.mjs"], { stdio: ["pipe", "pipe", "inherit"] });
            let buf = ""; const got = [];
            p.stdout.on("data", d => { buf += d;
              let i; while ((i = buf.indexOf("\n")) >= 0) {
                const l = buf.slice(0, i); buf = buf.slice(i + 1);
                if (l.trim()) got.push(JSON.parse(l));
              } });
            p.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: {} }) + "\n");
            p.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list" }) + "\n");
            setTimeout(() => {
              p.kill();
              const init = got.find(r => r.id === 1), list = got.find(r => r.id === 2);
              if (!init?.result?.serverInfo?.name) { console.error("initialize failed"); process.exit(1); }
              const tools = list?.result?.tools || [];
              // A FLOOR, not an exact count — raise it when tools are added, so a
              // regression that silently drops tools still fails the build. It sat
              // at 6 while the package shipped 13: a floor that far below reality
              // cannot catch losing half the catalogue.
              const FLOOR = 13;
              if (tools.length < FLOOR) {
                console.error(`expected at least ${FLOOR} tools, got ${tools.length}: ${tools.map(t => t.name).join(", ")}`);
                process.exit(1);
              }
              console.log(`OK: ${init.result.serverInfo.name} v${init.result.serverInfo.version}, ${tools.length} tools`);
            }, 4000);
          '

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack --dry-run

      # Provenance is a supply-chain attestation, not a requirement. It also
      # routes the publish through a stricter auth path that has been rejecting a
      # 2FA-bypass token with EOTP, so it is opt-in rather than blocking release.
      # Trusted Publishing (OIDC): no NPM_TOKEN at all. npm verifies the workflow
      # identity directly, which also restores provenance for free. Falls back to
      # the token only if a trusted publisher has not been configured yet.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
