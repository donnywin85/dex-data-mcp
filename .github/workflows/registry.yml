# Publish server.json to the official MCP Registry.
#
# Separate from publish.yml on purpose: npm and the registry are different
# systems with different failure modes, and a registry hiccup must never block
# or half-complete an npm release. npm is what people install; the registry is
# discovery metadata pointing AT the npm package, so it is published second.
#
# NAMESPACE: com.donnyautomation/dex-data is the CANONICAL entry — a
# DNS-verified namespace, which is why publishing to it needs a key rather than
# OIDC. GitHub OIDC can only vouch for io.github.<owner>/* namespaces; it cannot
# speak for a domain it does not control.
#
# ★ WHY THERE IS NO AUTOMATIC OIDC FALLBACK (learned the hard way, 2026-08-03).
#
# The key could not be found on the machine (searched 19,019 files), so the
# canonical entry sat frozen at 1.1.1 — a SIX-tool DEX-only server — while npm
# shipped 1.5.0 with twenty-two tools including the geocoding, search, holidays
# and LEI products the demand data actually shows payers for. Every agent
# browsing the registry was being shown the wrong product.
#
# The obvious fix was to publish to io.github.donnywin85/dex-data-mcp instead,
# which GitHub OIDC can authenticate with no secret at all. It was tried. The
# registry refused it:
#
#   NPM package ownership validation failed.
#   Expected mcpName 'io.github.donnywin85/dex-data-mcp',
#   got 'com.donnyautomation/dex-data'
#
# The registry proves you own the npm package by reading `mcpName` out of the
# PUBLISHED package.json. Ours says com.donnyautomation/dex-data. So switching
# namespace is not a workflow change — it needs a new npm release carrying a
# different mcpName, and from that release on the canonical entry can never be
# updated again, because the package would no longer claim it.
#
# That is a ONE-WAY DOOR, and it is unnecessary: the canonical namespace does
# not need the LOST key, only A key. DNS verification checks the public half in
# a TXT record on a domain we control. Generate a fresh keypair, update the
# record, add the private half as a secret, and the canonical entry is back.
#
# So the fallback stays behind an explicit opt-in input, never automatic.
#
# SETUP (once, phone-friendly) to restore the canonical namespace — a NEW
# keypair is fine, the original is not required:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  MCP_DNS_PRIVATE_KEY
#   Value: the ed25519 private key (hex) whose public half is in the
#          donnyautomation.com DNS TXT record. It is the same key that published
#          1.1.1 — no DNS change is needed if you still have it.
#
# RELEASE ORDER: npm first (publish.yml), then this. The registry entry names an
# npm version, so publishing metadata for a version that is not on npm yet points
# agents at something they cannot install.

name: registry

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate server.json and stop (no publish, no auth)'
        type: boolean
        default: false
      # ONE-WAY DOOR. Publishing under the OIDC namespace also requires an npm
      # release whose mcpName names it, and after that the canonical
      # com.donnyautomation/dex-data entry can never be updated again. Only set
      # this if abandoning that namespace is the intended outcome.
      abandon_canonical_namespace:
        description: 'PERMANENT: switch to io.github.donnywin85/* and give up com.donnyautomation/dex-data'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # GitHub OIDC, for the io.github.* fallback namespace

env:
  # Pinned: an unpinned publisher would change behaviour under us on a release
  # we did not choose. Bump deliberately.
  PUBLISHER_VERSION: '1.8.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    # `secrets` is not an available context in a step-level `if:` — it silently
    # reads as empty there. Hoisted so the guard below actually fires.
    env:
      HAS_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL --fail -o pub.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf pub.tgz mcp-publisher
          ./mcp-publisher --version

      # Real gate, and it needs no credentials: the registry checks the document
      # against its live schema. Catches a malformed or stale server.json before
      # any auth is attempted.
      - name: Validate server.json
        run: ./mcp-publisher validate

      # The registry entry points at an npm version. Publishing metadata for a
      # version that is not on npm sends agents to something they cannot install,
      # so refuse rather than advertise a package that does not exist yet.
      - name: server.json version must already exist on npm
        run: |
          set -euo pipefail
          WANT=$(node -p "require('./server.json').packages[0].version")
          NAME=$(node -p "require('./server.json').packages[0].identifier")
          echo "server.json advertises ${NAME}@${WANT}"
          if ! curl -sSf "https://registry.npmjs.org/${NAME}/${WANT}" > /dev/null; then
            echo "::error::${NAME}@${WANT} is not published on npm. Run the npm publish workflow first."
            exit 1
          fi
          echo "confirmed present on npm"

      # ★ ALREADY-PUBLISHED IS NOT A FAILURE.
      #
      #   The registry refuses a duplicate version with a 400, so re-running
      #   this after a release fails with a red X that means "nothing to do".
      #   A build that goes red for a non-problem teaches people to ignore red
      #   builds, which is expensive the day it means something.
      #
      #   Checked against the registry itself rather than guessed at: if this
      #   exact name+version is already there, the publish is skipped and the
      #   run is green.
      - name: Already published?
        id: already
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./server.json').name")
          VER=$(node -p "require('./server.json').version")
          FOUND=$(curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s), rows=j.servers||j.data||[];
                const hit=rows.some(r=>{const m=r.server||r; return m.name===process.argv[1] && String(m.version)===process.argv[2];});
                console.log(hit?"yes":"no");
              });' "$NAME" "$VER")
          echo "  ${NAME}@${VER} already in registry: ${FOUND}"
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"

      - name: Stop here (validate only)
        if: ${{ inputs.validate_only }}
        run: echo "validate_only set — not publishing."

      - name: Publish to the canonical DNS namespace
        if: ${{ !inputs.validate_only && env.HAS_KEY == 'true' && steps.already.outputs.found == 'no' }}
        env:
          KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The key is passed as an argument, so keep it out of the trace: `set
          # -x` or a failed command echoing argv would put it in a public log.
          set +x
          ./mcp-publisher login dns --domain donnyautomation.com --private-key "$KEY"
          ./mcp-publisher publish
          echo "published $(node -p "require('./server.json').name") $(node -p "require('./server.json').version")"

      # No key and no opt-in: stop, and say exactly what to do. Failing here is
      # correct — the alternative permanently abandons the canonical namespace.
      - name: Missing key
        if: ${{ !inputs.validate_only && env.HAS_KEY != 'true' && !inputs.abandon_canonical_namespace && steps.already.outputs.found == 'no' }}
        run: |
          echo "::error::MCP_DNS_PRIVATE_KEY is not set, so com.donnyautomation/dex-data cannot be updated."
          echo "The ORIGINAL key is not required — DNS verification only needs the public half of SOME"
          echo "keypair in a TXT record on donnyautomation.com, and we control that domain. Generate a"
          echo "fresh keypair, publish the public half, and add the private half under"
          echo "Settings -> Secrets and variables -> Actions as MCP_DNS_PRIVATE_KEY."
          echo ""
          echo "Do NOT reach for abandon_canonical_namespace to get around this. It is permanent:"
          echo "the registry reads mcpName out of the published npm package to prove ownership, so"
          echo "switching namespace needs an npm release naming the new one, and from that release"
          echo "onward com.donnyautomation/dex-data can never be updated again."
          exit 1

      # Explicitly requested namespace switch. This alone is NOT sufficient —
      # package.json's mcpName must already name the OIDC namespace on a
      # published npm version, or the registry rejects the publish. The error
      # below spells that out rather than leaving a bare 400.
      - name: Publish to the OIDC namespace (PERMANENT switch, opt-in)
        if: ${{ !inputs.validate_only && env.HAS_KEY != 'true' && inputs.abandon_canonical_namespace && steps.already.outputs.found == 'no' }}
        run: |
          set -euo pipefail
          echo "::warning::Publishing under io.github.donnywin85/dex-data-mcp. com.donnyautomation/dex-data is being abandoned permanently."
          MCPNAME=$(node -p "require('./package.json').mcpName || ''")
          if [ "$MCPNAME" != "io.github.donnywin85/dex-data-mcp" ]; then
            echo "::error::package.json mcpName is '${MCPNAME}'. The registry proves npm ownership by reading mcpName from the PUBLISHED package, so it must be 'io.github.donnywin85/dex-data-mcp' on a version that is already on npm. Change mcpName, publish to npm, then re-run this."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("server.json", "utf8"));
            j.name = "io.github.donnywin85/dex-data-mcp";
            fs.writeFileSync("server.json", JSON.stringify(j, null, 2) + "\n");
          '
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "published $(node -p "require('./server.json').name") $(node -p "require('./server.json').version")"

      - name: Nothing to do
        if: ${{ !inputs.validate_only && steps.already.outputs.found == 'yes' }}
        run: echo "This name+version is already in the registry — skipped, not failed."
