# Publish server.json to the official MCP Registry.
#
# Separate from publish.yml on purpose: npm and the registry are different
# systems with different failure modes, and a registry hiccup must never block
# or half-complete an npm release. npm is what people install; the registry is
# discovery metadata pointing AT the npm package, so it is published second.
#
# NAMESPACE: com.donnyautomation/dex-data is the CANONICAL entry — a
# DNS-verified namespace, which is why publishing to it needs a key rather than
# OIDC. GitHub OIDC can only vouch for io.github.<owner>/* namespaces; it cannot
# speak for a domain it does not control.
#
# ★ FALLBACK, added 2026-08-03. The DNS key could not be found anywhere on the
# machine (searched 19,019 files), and without it the canonical entry is frozen.
# It was frozen at 1.1.1 — a SIX-tool DEX-only server — while npm shipped 1.5.0
# with twenty-two tools including the geocoding, search, holidays and LEI
# products the demand data actually shows payers for. Every agent browsing the
# registry was being shown the wrong product, indefinitely, waiting on a secret
# nobody could produce.
#
# So when the key is absent this publishes to io.github.donnywin85/dex-data-mcp
# instead, authenticated by GitHub OIDC, which needs no secret at all. That
# namespace already holds stale 1.0.1 and 1.1.0 entries from earlier attempts;
# refreshing one of them is strictly better than leaving all three stale. The
# canonical DNS entry takes over automatically the moment the key is added — no
# code change, just the secret.
#
# SETUP (once, phone-friendly) to restore the canonical namespace:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  MCP_DNS_PRIVATE_KEY
#   Value: the ed25519 private key (hex) whose public half is in the
#          donnyautomation.com DNS TXT record. It is the same key that published
#          1.1.1 — no DNS change is needed if you still have it.
#
# RELEASE ORDER: npm first (publish.yml), then this. The registry entry names an
# npm version, so publishing metadata for a version that is not on npm yet points
# agents at something they cannot install.

name: registry

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate server.json and stop (no publish, no auth)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # GitHub OIDC, for the io.github.* fallback namespace

env:
  # Pinned: an unpinned publisher would change behaviour under us on a release
  # we did not choose. Bump deliberately.
  PUBLISHER_VERSION: '1.8.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    # `secrets` is not an available context in a step-level `if:` — it silently
    # reads as empty there. Hoisted so the guard below actually fires.
    env:
      HAS_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL --fail -o pub.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf pub.tgz mcp-publisher
          ./mcp-publisher --version

      # Real gate, and it needs no credentials: the registry checks the document
      # against its live schema. Catches a malformed or stale server.json before
      # any auth is attempted.
      - name: Validate server.json
        run: ./mcp-publisher validate

      # The registry entry points at an npm version. Publishing metadata for a
      # version that is not on npm sends agents to something they cannot install,
      # so refuse rather than advertise a package that does not exist yet.
      - name: server.json version must already exist on npm
        run: |
          set -euo pipefail
          WANT=$(node -p "require('./server.json').packages[0].version")
          NAME=$(node -p "require('./server.json').packages[0].identifier")
          echo "server.json advertises ${NAME}@${WANT}"
          if ! curl -sSf "https://registry.npmjs.org/${NAME}/${WANT}" > /dev/null; then
            echo "::error::${NAME}@${WANT} is not published on npm. Run the npm publish workflow first."
            exit 1
          fi
          echo "confirmed present on npm"

      - name: Stop here (validate only)
        if: ${{ inputs.validate_only }}
        run: echo "validate_only set — not publishing."

      - name: Publish to the canonical DNS namespace
        if: ${{ !inputs.validate_only && env.HAS_KEY == 'true' }}
        env:
          KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The key is passed as an argument, so keep it out of the trace: `set
          # -x` or a failed command echoing argv would put it in a public log.
          set +x
          ./mcp-publisher login dns --domain donnyautomation.com --private-key "$KEY"
          ./mcp-publisher publish
          echo "published $(node -p "require('./server.json').name") $(node -p "require('./server.json').version")"

      # No key: publish the SAME metadata under the OIDC namespace rather than
      # failing and leaving the registry advertising a six-tool server forever.
      # server.json is rewritten in the runner only — the committed file keeps
      # the canonical name, so this never quietly changes what we publish once
      # the key exists.
      - name: Publish to the OIDC fallback namespace
        if: ${{ !inputs.validate_only && env.HAS_KEY != 'true' }}
        run: |
          set -euo pipefail
          echo "::warning::MCP_DNS_PRIVATE_KEY is not set — publishing to io.github.donnywin85/dex-data-mcp instead of the canonical com.donnyautomation/dex-data. Add the secret to restore the canonical namespace."
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("server.json", "utf8"));
            j.name = "io.github.donnywin85/dex-data-mcp";
            fs.writeFileSync("server.json", JSON.stringify(j, null, 2) + "\n");
          '
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "published $(node -p "require('./server.json').name") $(node -p "require('./server.json').version")"
